<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Harsh Bagadiya — Full Stack Developer</title>
  <desc id="desc">Animated terminal banner with matrix rain, a typing shell, and a rotating wireframe network orb.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020509"/>
      <stop offset=".5" stop-color="#050b16"/>
      <stop offset="1" stop-color="#02060c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00ffc6"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="32%">
      <stop stop-color="#eafffb"/>
      <stop offset=".22" stop-color="#3dffd0"/>
      <stop offset=".6" stop-color="#0e8f8a"/>
      <stop offset="1" stop-color="#04141f"/>
    </radialGradient>
    <linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".22" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".82" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="rainMask">
      <rect x="0" y="0" width="1200" height="400" fill="url(#fadeV)"/>
    </mask>
    <clipPath id="roundedClip"><rect width="1200" height="400" rx="24"/></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c3350" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .rainCol { fill: #1fe37a; font-size: 14px; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-400px); } 100% { transform: translateY(400px); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .g1 { animation: gj 3.4s infinite steps(1); }
    .g2 { animation: gj2 3.4s infinite steps(1); }
    @keyframes gj { 0%,93%,100% { transform: translate(0,0); opacity:.9; } 94% { transform: translate(-3px,0); opacity:.55; } 96% { transform: translate(2px,0); opacity:.7; } }
    @keyframes gj2 { 0%,91%,100% { transform: translate(0,0); opacity:.9; } 92% { transform: translate(3px,0); opacity:.5; } 95% { transform: translate(-2px,0); opacity:.65; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(1.08); } }
    .spin1 { transform-origin: 960px 190px; animation: sp1 14s linear infinite; }
    .spin2 { transform-origin: 960px 190px; animation: sp2 10s linear infinite reverse; }
    .spin3 { transform-origin: 960px 190px; animation: sp3 18s linear infinite; }
    @keyframes sp1 { to { transform: rotate(360deg) scaleY(.42); } }
    @keyframes sp2 { to { transform: rotate(360deg) scaleY(.78); } }
    @keyframes sp3 { to { transform: rotate(-360deg); } }
    .coreP { animation: corebeat 2.8s ease-in-out infinite; transform-origin: 960px 190px; }
    @keyframes corebeat { 50% { transform: scale(1.05); } }
  </style>

  <g clip-path="url(#roundedClip)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- matrix rain -->
    <g mask="url(#rainMask)" opacity=".5">
      <g class="scan" style="animation-duration:7s"><text class="rainCol" x="40" y="0">01<tspan x="40" dy="18">10</tspan><tspan x="40" dy="18">#$</tspan><tspan x="40" dy="18">01</tspan><tspan x="40" dy="18">&gt;_</tspan><tspan x="40" dy="18">10</tspan><tspan x="40" dy="18">01</tspan></text></g>
      <g class="scan" style="animation-duration:9s;animation-delay:-2s"><text class="rainCol" x="95" y="0">10<tspan x="95" dy="18">01</tspan><tspan x="95" dy="18">/\</tspan><tspan x="95" dy="18">11</tspan><tspan x="95" dy="18">00</tspan><tspan x="95" dy="18">$&amp;</tspan><tspan x="95" dy="18">01</tspan></text></g>
      <g class="scan" style="animation-duration:6.4s;animation-delay:-1s"><text class="rainCol" x="150" y="0">11<tspan x="150" dy="18">00</tspan><tspan x="150" dy="18">01</tspan><tspan x="150" dy="18">*&amp;</tspan><tspan x="150" dy="18">10</tspan><tspan x="150" dy="18">01</tspan></text></g>
      <g class="scan" style="animation-duration:8.2s;animation-delay:-4s"><text class="rainCol" x="205" y="0">01<tspan x="205" dy="18">&lt;/</tspan><tspan x="205" dy="18">10</tspan><tspan x="205" dy="18">11</tspan><tspan x="205" dy="18">00</tspan><tspan x="205" dy="18">01</tspan></text></g>
      <g class="scan" style="animation-duration:7.6s;animation-delay:-3s"><text class="rainCol" x="640" y="0">##<tspan x="640" dy="18">01</tspan><tspan x="640" dy="18">10</tspan><tspan x="640" dy="18">=&gt;</tspan><tspan x="640" dy="18">11</tspan><tspan x="640" dy="18">00</tspan></text></g>
      <g class="scan" style="animation-duration:9.4s;animation-delay:-5s"><text class="rainCol" x="700" y="0">10<tspan x="700" dy="18">01</tspan><tspan x="700" dy="18">00</tspan><tspan x="700" dy="18">11</tspan><tspan x="700" dy="18">/\</tspan><tspan x="700" dy="18">10</tspan></text></g>
      <g class="scan" style="animation-duration:6.8s;animation-delay:-2.5s"><text class="rainCol" x="1150" y="0">01<tspan x="1150" dy="18">$&amp;</tspan><tspan x="1150" dy="18">11</tspan><tspan x="1150" dy="18">00</tspan><tspan x="1150" dy="18">10</tspan></text></g>
    </g>

    <!-- status chip -->
    <g transform="translate(40 34)">
      <rect width="150" height="30" rx="15" fill="#0c1c2b" stroke="#1fe37a" stroke-opacity=".55"/>
      <circle cx="18" cy="15" r="4.5" fill="#3dffb0"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="33" y="20" fill="#8ff5cf" font-size="12" letter-spacing="1.3">STATUS: ONLINE</text>
    </g>
    <text x="1160" y="42" text-anchor="end" fill="#3a5a7a" font-size="12" letter-spacing="1">root@harsh-dev:~$</text>

    <!-- glitch name -->
    <g transform="translate(40 128)">
      <text class="g1" x="2" y="0" fill="#ff2e8f" font-size="46" font-weight="700" opacity=".8">HARSH BAGADIYA</text>
      <text class="g2" x="-2" y="0" fill="#00e5ff" font-size="46" font-weight="700" opacity=".8">HARSH BAGADIYA</text>
      <text x="0" y="0" fill="#f3fbff" font-size="46" font-weight="700">HARSH BAGADIYA</text>
    </g>
    <text x="42" y="168" fill="url(#neon)" font-size="18" letter-spacing="3">FULL STACK DEVELOPER // AI &amp; AUTOMATION</text>

    <!-- terminal window -->
    <g transform="translate(42 195)" filter="url(#softShadow)">
      <rect width="560" height="172" rx="10" fill="#060d18" stroke="#123049"/>
      <rect width="560" height="26" rx="10" fill="#0c1c2e"/>
      <rect y="16" width="560" height="10" fill="#0c1c2e"/>
      <circle cx="17" cy="13" r="5" fill="#ff5f56"/>
      <circle cx="35" cy="13" r="5" fill="#ffbd2e"/>
      <circle cx="53" cy="13" r="5" fill="#27c93f"/>
      <text x="280" y="17" text-anchor="middle" fill="#5c7a99" font-size="11">bash — harsh-dev</text>

      <g font-size="14">
        <text x="18" y="52" fill="#3dffb0">$</text>
        <text x="34" y="52" fill="#d7f6ff">whoami</text>
        <clipPath id="clipA"><rect x="0" y="66" width="0" height="20"><animate attributeName="width" from="0" to="330" dur="1s" begin="0s;t4.end+2.2s" id="t1" fill="freeze"/></rect></clipPath>
        <text x="18" y="82" fill="#9fb3c8" clip-path="url(#clipA)">&gt; full-stack developer, ahmedabad</text>

        <text x="18" y="106" fill="#3dffb0">$</text>
        <text x="34" y="106" fill="#d7f6ff">cat stack.json</text>
        <clipPath id="clipB"><rect x="0" y="120" width="0" height="20"><animate attributeName="width" from="0" to="520" dur="1.1s" begin="t1.end+.3s" id="t2" fill="freeze"/></rect></clipPath>
        <text x="18" y="136" fill="#9fb3c8" clip-path="url(#clipB)">&gt; [react, node, typescript, python, flutter]</text>

        <text x="18" y="160" fill="#3dffb0">$</text>
        <text x="34" y="160" fill="#d7f6ff">./deploy.sh --env=prod</text>
        <clipPath id="clipC"><rect x="0" y="66" width="0" height="0"><animate attributeName="width" from="0" to="1" dur=".1s" begin="t2.end+.3s" id="t3" fill="freeze"/></rect></clipPath>
      </g>
      <rect x="248" y="146" width="9" height="15" fill="#3dffb0" class="cursor"/>
    </g>

    <!-- wireframe network orb -->
    <g transform="translate(0,0)">
      <g class="coreP">
        <circle cx="960" cy="190" r="86" fill="url(#core)"/>
        <circle cx="960" cy="190" r="104" fill="none" stroke="url(#neon)" stroke-width="1.4" opacity=".35" class="pulse"/>
      </g>
      <g class="spin1" fill="none" stroke="#5be9ff" stroke-width="1.3" opacity=".65" filter="url(#glow)">
        <ellipse cx="960" cy="190" rx="150" ry="150"/>
      </g>
      <g class="spin2" fill="none" stroke="#9d86ff" stroke-width="1.2" opacity=".55">
        <ellipse cx="960" cy="190" rx="150" ry="150"/>
      </g>
      <g class="spin3" fill="none" stroke="#2fffd0" stroke-width="1" opacity=".4">
        <ellipse cx="960" cy="190" rx="118" ry="55"/>
      </g>
      <!-- orbiting packets -->
      <circle r="4.5" fill="#eafffb">
        <animateMotion dur="7s" repeatCount="indefinite" path="M960,80 A150,150 0 1,1 959,80 A150,150 0 1,1 960,80 Z"/>
      </circle>
      <circle r="3.5" fill="#ff8de6">
        <animateMotion dur="10s" repeatCount="indefinite" path="M842,190 A118,55 0 1,1 841,190 A118,55 0 1,1 842,190 Z"/>
      </circle>
      <!-- hex nodes -->
      <g fill="#0e1c2b" stroke="#5be9ff" stroke-width="1.2">
        <circle cx="1078" cy="150" r="7"><animate attributeName="opacity" values="1;.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="852" cy="238" r="6"><animate attributeName="opacity" values=".4;1;.4" dur="3.1s" repeatCount="indefinite"/></circle>
        <circle cx="1006" cy="82" r="5"><animate attributeName="opacity" values="1;.5;1" dur="2.2s" repeatCount="indefinite"/></circle>
      </g>
      <g stroke="#2fffd0" stroke-width="1" opacity=".3">
        <line x1="960" y1="190" x2="1078" y2="150"/>
        <line x1="960" y1="190" x2="852" y2="238"/>
        <line x1="960" y1="190" x2="1006" y2="82"/>
      </g>
    </g>

    <text x="880" y="336" text-anchor="middle" fill="#3a5a7a" font-size="11" letter-spacing="3">BUILD • BREAK • DEBUG • SHIP</text>
  </g>
</svg>
