<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Harsh Bagadiya — Full Stack Developer</title>
  <desc id="desc">An animated futuristic developer profile banner with a softly rotating 3D orb.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset=".48" stop-color="#0d1c33"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="28%">
      <stop stop-color="#c4f1ff"/>
      <stop offset=".18" stop-color="#57c7ff"/>
      <stop offset=".58" stop-color="#2765d8"/>
      <stop offset="1" stop-color="#101c59"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7ee7ff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <style>
    .orbit { transform-origin: 970px 165px; animation: spin 12s linear infinite; }
    .orbit2 { transform-origin: 970px 165px; animation: spin-reverse 9s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    .dot { animation: drift 3.2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-reverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 50% { opacity: .46; transform: scale(1.12); } }
    @keyframes drift { 50% { transform: translateY(-7px); opacity: .45; } }
  </style>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <path d="M0 276C190 228 295 344 505 272S860 184 1200 254V330H0Z" fill="#07111f" opacity=".68"/>
  <g opacity=".3" fill="#8edbff">
    <circle class="dot" cx="70" cy="64" r="2"/><circle class="dot" cx="326" cy="58" r="2"/><circle class="dot" cx="470" cy="255" r="2"/><circle class="dot" cx="747" cy="57" r="2"/><circle class="dot" cx="1108" cy="84" r="2"/>
  </g>
  <g transform="translate(74 77)">
    <rect width="91" height="27" rx="13.5" fill="#173453" stroke="#3685be"/>
    <circle cx="18" cy="13.5" r="4" fill="#55f0a4" class="pulse"/>
    <text x="31" y="18" fill="#b7e5ff" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.2">AVAILABLE</text>
  </g>
  <text x="72" y="153" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Harsh Bagadiya</text>
  <text x="75" y="197" fill="#70c9ff" font-family="monospace" font-size="21">FULL STACK DEVELOPER</text>
  <rect x="74" y="220" width="425" height="1" fill="#58a6ff" opacity=".55"/>
  <text x="75" y="254" fill="#aebdd1" font-family="Arial, sans-serif" font-size="16">React  •  Node.js  •  Python  •  AI &amp; Automation</text>
  <g filter="url(#shadow)">
    <circle cx="970" cy="165" r="82" fill="url(#orb)"/>
    <ellipse cx="945" cy="137" rx="27" ry="17" fill="#d8f8ff" opacity=".4" transform="rotate(-28 945 137)"/>
    <circle cx="970" cy="165" r="97" fill="none" stroke="url(#stroke)" stroke-width="2" opacity=".32" class="pulse"/>
  </g>
  <g class="orbit" fill="none" stroke="url(#stroke)" filter="url(#glow)">
    <ellipse cx="970" cy="165" rx="145" ry="45" stroke-width="2"/>
    <circle cx="1114" cy="166" r="6" fill="#8ee8ff" stroke="none"/>
  </g>
  <g class="orbit2" fill="none" stroke="#8d7bff" opacity=".8">
    <ellipse cx="970" cy="165" rx="47" ry="143" stroke-width="1.5"/>
    <circle cx="970" cy="22" r="5" fill="#a99dff" stroke="none"/>
  </g>
  <text x="898" y="293" fill="#7893b3" font-family="monospace" font-size="12" letter-spacing="2">BUILD • LEARN • SHIP</text>
</svg>
